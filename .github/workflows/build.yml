name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  lint:
    name: Lint check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Replace Gradle wrapper URL
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|maven.myket.ir/gradle|services.gradle.org|g' gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Check formatting
        run: ./gradlew ktfmtCheck

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: write
      code-quality: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Replace Gradle wrapper URL
        run: |
          # Replace Myket Gradle distribution host with the official services.gradle.org
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|maven.myket.ir/gradle|services.gradle.org|g' gradle/wrapper/gradle-wrapper.properties
            echo "Updated gradle-wrapper.properties:" && grep distributionUrl gradle/wrapper/gradle-wrapper.properties || true
          else
            echo "No gradle-wrapper.properties found, skipping URL replacement"
          fi

      - name: Run unit tests and coverage
        run: ./gradlew jvmTest test koverXmlReport

      - name: Append Coverage to GitHub Summary
        run: |
          # Helper function to extract value from Kover XML report
          get_cov() {
            local path="$1"
            if [ -f "$path" ]; then
              awk -F'"' '/<counter type="LINE"/ {m=$4; c=$6} END {if (m+c > 0) printf "%.2f%%", c*100/(m+c); else printf "0%%"}' "$path"
            else
              printf "0%%"
            fi
          }
          
          SERVER_COV=$(get_cov "server/build/reports/kover/report.xml")
          SHARED_COV=$(get_cov "app/shared/build/reports/kover/report.xml")
          CORE_COV=$(get_cov "core/build/reports/kover/report.xml")
          TOTAL_COV=$(get_cov "build/reports/kover/report.xml")
          
          # Clean for badge (remove %)
          CLEAN_TOTAL_COV=$(echo $TOTAL_COV | tr -d '%')
          
          # Export for badge action
          echo "TOTAL_COVERAGE=$CLEAN_TOTAL_COV" >> $GITHUB_ENV
          
          get_status() {
            local val=$(echo $1 | tr -d '%[:space:]' | cut -d. -f1)
            if [ -z "$val" ]; then echo "❌ Error"; return; fi
            if [ "$val" -ge 80 ]; then echo "✅ Passed"; else echo "⚠️ Low"; fi
          }

          echo "### 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Coverage % | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Server | $SERVER_COV | $(get_status $SERVER_COV) |" >> $GITHUB_STEP_SUMMARY
          echo "| App Shared | $SHARED_COV | $(get_status $SHARED_COV) |" >> $GITHUB_STEP_SUMMARY
          echo "| Core | $CORE_COV | $(get_status $CORE_COV) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Project** | **$TOTAL_COV** | $(get_status $TOTAL_COV) |" >> $GITHUB_STEP_SUMMARY

      - name: Update Coverage Badge Gist
        if: github.event_name != 'pull_request'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 91190edf571eb1024def80464e70b88a
          filename: coverage.json
          label: Coverage
          message: ${{ env.TOTAL_COVERAGE }}%
          valColorRange: ${{ env.TOTAL_COVERAGE }}
          maxColorRange: 100
          minColorRange: 0

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "build/reports/kover/"
